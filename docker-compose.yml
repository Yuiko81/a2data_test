services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: generator
    command: python generator.py
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb

    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_NAME: logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-worker
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_NAME: logs
      REDIS_CONSUMER_GROUP: log-workers
      REDIS_CONSUMER_NAME: worker-1
      WORKER_BATCH_SIZE: 1000
      WORKER_FLUSH_INTERVAL_MS: 500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  retention:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-retention
    command: python retention.py
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
      RETENTION_DAYS: 7
      RETENTION_INTERVAL_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  partition-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-partition-manager
    command: python partition_manager.py
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
      PARTITIONS_AHEAD: 1
      PARTITION_CREATION_INTERVAL_SECONDS: 86400
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    command: pytest -q
    environment:
      TEST_DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["test"]


volumes:
  postgres-db-volume:
  redis-data-volume:
