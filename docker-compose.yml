services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: generator
    command: python generator.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEED_TOTAL: ${SEED_TOTAL}
      SEED_BATCH_SIZE: ${SEED_BATCH_SIZE}

    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["generator"]

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data-volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-worker
    command: python worker.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE}
      WORKER_FLUSH_INTERVAL_MS: ${WORKER_FLUSH_INTERVAL_MS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  retention:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-retention
    command: python retention.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RETENTION_DAYS: ${RETENTION_DAYS}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  partition-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log-partition-manager
    command: python partition_manager.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PARTITIONS_AHEAD: ${PARTITIONS_AHEAD}
      PARTITION_CREATION_INTERVAL_SECONDS: ${PARTITION_CREATION_INTERVAL_SECONDS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  load-test:
    build:
      context: .
      dockerfile: Dockerfile
    command: python load_test.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME}
      LOAD_API_BASE_URL: ${LOAD_API_BASE_URL}
      LOAD_WARMUP_SECONDS: ${LOAD_WARMUP_SECONDS}
      LOAD_DURATION_SECONDS: ${LOAD_DURATION_SECONDS}
      LOAD_LOGS_PER_SECOND: ${LOAD_LOGS_PER_SECOND}
      LOAD_BATCH_SIZE: ${LOAD_BATCH_SIZE}
      LOAD_SEARCH_RPS: ${LOAD_SEARCH_RPS}
      LOAD_SEARCH_P95_LIMIT_MS: ${LOAD_SEARCH_P95_LIMIT_MS}
      LOAD_REQUEST_TIMEOUT_SECONDS: ${LOAD_REQUEST_TIMEOUT_SECONDS}
      LOAD_DRAIN_TIMEOUT_SECONDS: ${LOAD_DRAIN_TIMEOUT_SECONDS}
      LOAD_MIN_DATABASE_ROWS: ${LOAD_MIN_DATABASE_ROWS}
      LOAD_MAX_SCHEDULER_LAG_MS: ${LOAD_MAX_SCHEDULER_LAG_MS}
    depends_on:
      api:
        condition: service_started
      worker:
        condition: service_started
    profiles: ["load"]

  insert-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    command: python insert_benchmark.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INSERT_BENCHMARK_RECORDS: ${INSERT_BENCHMARK_RECORDS}
      INSERT_BENCHMARK_BATCH_SIZE: ${INSERT_BENCHMARK_BATCH_SIZE}
      INSERT_BENCHMARK_WARMUP_RUNS: ${INSERT_BENCHMARK_WARMUP_RUNS}
      INSERT_BENCHMARK_MEASURE_RUNS: ${INSERT_BENCHMARK_MEASURE_RUNS}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["load"]

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    command: pytest -q
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["test"]


volumes:
  postgres-db-volume:
  redis-data-volume:
